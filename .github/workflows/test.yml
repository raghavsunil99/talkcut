name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg-static downloads its binary in an install script; media.test.js needs it.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The end-to-end tests drive the real app, so check the Electron binary installed first.
      - run: npx electron --version
      - run: npm run test:e2e
